<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Gym Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#292824;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 15px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:25px;margin:0}.sub{font-size:12px;color:#77736c;margin-top:3px}
button,select,input{font:inherit}button{border:0;cursor:pointer}.icon{background:#ebe7df;border-radius:12px;padding:10px 12px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tab{padding:10px 14px;border:1px solid #e4dfd7;background:#fff;border-radius:999px;white-space:nowrap}.tab.active{background:#5b6178;color:#fff;border-color:#5b6178}
.card{background:#fff;border:1px solid #e5e0d8;border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 3px 12px #00000008}
label{display:block;font-size:11px;font-weight:700;color:#77736c;margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;border:1px solid #ddd7ce;background:#fff;border-radius:10px;padding:10px 11px;color:#292824}
.primary{background:#5b6178;color:#fff;width:100%;padding:12px;border-radius:11px;font-weight:750}.secondary{background:#eeeae3;color:#292824;padding:10px 13px;border-radius:10px;font-weight:650}.danger{background:#f8e7e7;color:#a84e4e;padding:9px 11px;border-radius:10px}
.exercise-title{font-size:18px;font-weight:800}.meta,.small{font-size:12px;color:#77736c}.last{background:#f5f2ed;border-radius:11px;padding:10px;margin:12px 0;font-size:13px}
.sethead,.setrow{display:grid;grid-template-columns:35px 1fr 1fr;gap:8px;align-items:center}.sethead{font-size:10px;color:#77736c;text-align:center;margin-bottom:5px}.setrow{margin-bottom:7px}.setno{font-weight:750;text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1}.status{font-weight:750;margin-top:10px}.good{color:#2e7d5b}.bad{color:#b65c5c}.neutral{color:#77736c}
.hidden{display:none}.empty{text-align:center;color:#77736c;padding:25px}.history{padding:10px 0;border-bottom:1px solid #e8e3db}.history:last-child{border-bottom:0}
.program-row{display:grid;grid-template-columns:1.5fr .6fr .8fr auto;gap:6px;margin-bottom:8px}.section-title{font-size:16px;font-weight:800;margin:2px 0 10px}

.session-table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
.session-table th{font-size:11px;color:#77736c;text-align:left;padding:8px;background:#f7f4ef}
.session-table td{padding:6px;border-top:1px solid #eee;vertical-align:middle}
.session-table input{min-width:80px}
.session-table .exercise-title-cell{min-width:190px;vertical-align:top;padding-top:12px}
.session-table .setno{width:48px;text-align:center;color:#77736c}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1>My Gym Tracker</h1><div class="sub">Simple • progressive • yours</div></div><button class="icon" onclick="openSettings()">⚙️</button></header>

<nav class="tabs">
<button id="t-workout" class="tab active" onclick="page('workout')">Workout</button>
<button id="t-progress" class="tab" onclick="page('progress')">Progress</button>
<button id="t-history" class="tab" onclick="page('history')">History</button>
</nav>

<main id="workout">
<div class="card"><div class="grid">
<div><label>DATE</label><input id="date" type="date"></div>
<div><label>DAY</label><select id="day" onchange="renderWorkoutSession()"></select></div>
</div></div>

<div id="workoutSessionBox"></div>
</main>

<main id="progress" class="hidden"><div id="progressBox"></div></main>
<main id="history" class="hidden"><div id="historyBox"></div></main>

<main id="settings" class="hidden">
<div class="card"><div class="section-title">Program Setup</div><div class="small" style="margin-bottom:13px">Add or edit exercises directly here. Existing workout history is kept.</div><div id="programBox"></div></div>
</main>
</div>

<script>
const KEY="gymTrackerV2";
const seedProgram={
 UPPER:[["Seated Shoulder Press",4,"10"],["Standing Incline Lateral Raise",4,"10"],["Incline Cable Bench Press",4,"10"],["Biceps Cable Curl",4,"10"]],
 LOWER:[["Split Squat (Mobility)",1,"10 / leg"]],
 "FULL BODY":[["Seated Shoulder Press",4,"10"],["Standing Incline Lateral Raise",4,"10"],["Incline Cable Bench Press",4,"10"],["Biceps Cable Curl",4,"10"],["Split Squat (Mobility)",1,"10 / leg"],["Full Plank",2,"1:00"]]
};
const seedLogs=[
{date:"2026-09-09",day:"FULL BODY",exercise:"Split Squat (Mobility)",sets:[{kg:"",reps:"10 / leg"}],rir:"",notes:"Mobility warm-up"},
{date:"2026-09-09",day:"FULL BODY",exercise:"Seated Shoulder Press",sets:[{kg:"6",reps:"10"},{kg:"6",reps:"10"},{kg:"6",reps:"10"},{kg:"6",reps:"10"}],rir:"",notes:"Session 1"},
{date:"2026-09-09",day:"FULL BODY",exercise:"Standing Incline Lateral Raise",sets:[{kg:"4",reps:"10"},{kg:"4",reps:"10"},{kg:"4",reps:"10"},{kg:"4",reps:"10"}],rir:"",notes:"Session 1"},
{date:"2026-09-09",day:"FULL BODY",exercise:"Incline Cable Bench Press",sets:[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}],rir:"",notes:"Weight/reps not recorded"},
{date:"2026-09-09",day:"FULL BODY",exercise:"Biceps Cable Curl",sets:[{kg:"12.5",reps:"10"},{kg:"12.5",reps:"10"},{kg:"12.5",reps:"10"},{kg:"12.5",reps:"10"}],rir:"",notes:"Session 1"},
{date:"2026-09-09",day:"FULL BODY",exercise:"Full Plank",sets:[{kg:"",reps:"1:00"},{kg:"",reps:"1:00"}],rir:"",notes:"Core"}
];

let data=JSON.parse(localStorage.getItem(KEY)||"null");
if(!data){data={program:JSON.parse(JSON.stringify(seedProgram)),logs:JSON.parse(JSON.stringify(seedLogs))};save();}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById("date").value=today();

function page(which){
["workout","progress","history","settings"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==which));
["workout","progress","history"].forEach(x=>document.getElementById("t-"+x)?.classList.toggle("active",x===which));
if(which==="progress")renderProgress();if(which==="history")renderHistory();
}
function openSettings(){page("settings");renderProgram();}

function loadDays(){
  const day=document.getElementById("day");
  day.innerHTML=Object.keys(data.program).map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
  const savedDay=localStorage.getItem("gymLastDay");
  if(savedDay && data.program[savedDay]) day.value=savedDay;
  const date=document.getElementById("date");
  if(!date.value) date.value=new Date().toISOString().slice(0,10);
  renderWorkoutSession();
  renderProgress();
  renderHistory();
  renderProgram();
}

function renderWorkoutSession(){
  const day=document.getElementById("day").value;
  localStorage.setItem("gymLastDay",day);
  const list=data.program[day]||[];
  const date=document.getElementById("date").value;
  if(!list.length){
    document.getElementById("workoutSessionBox").innerHTML='<div class="card empty">Belum ada exercise untuk hari ini. Tambahkan di ⚙️ Program Setup.</div>';
    return;
  }

  // Find an existing session for this date/day, including new grouped sessions.
  const existing=data.logs.findLast ? data.logs.findLast(x=>x.date===date && x.day===day && Array.isArray(x.exercises)) : [...data.logs].reverse().find(x=>x.date===date&&x.day===day&&Array.isArray(x.exercises));

  // For legacy per-exercise logs, use the most recent matching log for each exercise.
  const rows=[];
  list.forEach((item,ei)=>{
    const name=item[0], sets=Math.max(1,Number(item[1])||1);
    let exSets=null, rir="", notes="";
    if(existing){
      const ex=(existing.exercises||[]).find(x=>x.exercise===name);
      if(ex){exSets=ex.sets||[];rir=ex.rir||"";notes=ex.notes||"";}
    } else {
      const legacy=[...data.logs].reverse().find(x=>x.date===date&&x.day===day&&x.exercise===name);
      if(legacy){exSets=legacy.sets||[];rir=legacy.rir||"";notes=legacy.notes||"";}
    }
    for(let s=0;s<sets;s++){
      const prev=exSets?.[s]||{};
      rows.push(`
        <tr data-exercise="${escAttr(name)}" data-set="${s}">
          ${s===0?`<td class="exercise-title-cell" rowspan="${sets}"><b>${esc(name)}</b><div class="small">${sets} sets • target ${esc(item[2])}</div></td>`:""}
          <td class="setno">S${s+1}</td>
          <td><input class="ws-kg" inputmode="decimal" placeholder="${esc(prev.kg||"kg")}" value="${esc(prev.kg||"")}"></td>
          <td><input class="ws-reps" inputmode="numeric" placeholder="${esc(prev.reps||"reps")}" value="${esc(prev.reps||"")}"></td>
          ${s===0?`<td rowspan="${sets}" class="rir-cell"><input class="ws-rir" inputmode="numeric" placeholder="e.g. 2" value="${esc(rir)}"></td><td rowspan="${sets}" class="notes-cell"><input class="ws-notes" placeholder="How did it feel?" value="${esc(notes)}"></td>`:""}
        </tr>`);
    }
  });

  document.getElementById("workoutSessionBox").innerHTML=`
  <div class="card">
    <div class="section-title">${esc(day)} — Full Workout</div>
    <div class="small" style="margin-bottom:12px">Isi semua gerakan di bawah, lalu cukup klik <b>Save Workout</b> satu kali.</div>
    <div style="overflow:auto">
      <table class="session-table">
        <thead><tr><th>EXERCISE</th><th>SET</th><th>KG</th><th>REPS</th><th>RIR</th><th>NOTES</th></tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
    <button class="primary" style="margin-top:14px" onclick="saveWorkoutSession()">✓ SAVE WORKOUT</button>
  </div>`;
}

function escAttr(v){return esc(v).replace(/"/g,"&quot;");}

function saveWorkoutSession(){
  const date=document.getElementById("date").value;
  const day=document.getElementById("day").value;
  if(!date){alert("Pilih tanggal dulu ya.");return;}
  const trs=[...document.querySelectorAll("#workoutSessionBox tbody tr[data-exercise]")];
  const grouped={};
  trs.forEach(tr=>{
    const name=tr.dataset.exercise;
    if(!grouped[name]) grouped[name]={sets:[],rir:"",notes:""};
    grouped[name].sets.push({
      kg:tr.querySelector(".ws-kg")?.value||"",
      reps:tr.querySelector(".ws-reps")?.value||""
    });
    const rir=tr.querySelector(".ws-rir"); if(rir) grouped[name].rir=rir.value;
    const notes=tr.querySelector(".ws-notes"); if(notes) grouped[name].notes=notes.value;
  });

  const hasInput=Object.values(grouped).some(x=>x.sets.some(s=>s.kg||s.reps));
  if(!hasInput){alert("Isi minimal 1 set dulu ya.");return;}

  // Remove only a previous grouped session for this date/day.
  data.logs=data.logs.filter(x=>!(x.date===date && x.day===day && Array.isArray(x.exercises)));

  data.logs.push({
    id:"session_"+Date.now(),
    date, day,
    exercises:Object.entries(grouped).map(([exercise,v])=>({exercise,sets:v.sets,rir:v.rir,notes:v.notes}))
  });

  save();
  renderProgress();
  renderHistory();
  alert("Workout tersimpan ✓");
}

function normalizeLogs(){
  const out=[];
  data.logs.forEach(x=>{
    if(Array.isArray(x.exercises)){
      out.push(x);
    }else{
      out.push({
        date:x.date,day:x.day,
        exercises:[{exercise:x.exercise,sets:x.sets||[],rir:x.rir||"",notes:x.notes||""}]
      });
    }
  });
  return out;
}

function exerciseLogs(name){
  return normalizeLogs().flatMap(session=>
    session.exercises.filter(e=>e.exercise===name).map(e=>({...e,date:session.date,day:session.day}))
  );
}

function best(x){
  const n=(x.sets||[]).map(s=>parseFloat(s.kg)).filter(Number.isFinite);
  return n.length?Math.max(...n):0;
}
function reps(x){return (x.sets||[]).reduce((a,s)=>a+(parseInt(s.reps)||0),0)}

function renderProgress(){
  let all=Object.values(data.program).flat(),out="";
  all.forEach(item=>{
    let arr=exerciseLogs(item[0]),l=arr.at(-1),p=arr.at(-2),change=l&&p?best(l)-best(p):null;
    out+=`<div class="card"><div class="exercise-title">${esc(item[0])}</div>${
      l?`<div class="grid" style="margin-top:10px"><div><div class="small">LAST BEST</div><b style="font-size:21px">${best(l)||"—"} ${best(l)?"kg":""}</b></div><div><div class="small">TOTAL REPS</div><b style="font-size:21px">${reps(l)||"—"}</b></div></div><div class="status ${change>0?"good":change<0?"bad":"neutral"}">${p?(change>0?"↑ Progress":change<0?"↓ Check":"→ Same"):"Baseline"}</div>`
      :'<div class="empty">Not logged yet</div>'}</div>`;
  });
  document.getElementById("progressBox").innerHTML=out;
}

function renderHistory(){
  const sessions=normalizeLogs();
  // Group legacy entries by date/day into one display session.
  const grouped={};
  sessions.forEach(s=>{
    const key=s.date+"|"+s.day;
    if(!grouped[key]) grouped[key]={date:s.date,day:s.day,exercises:[]};
    grouped[key].exercises.push(...s.exercises);
  });
  const arr=Object.values(grouped).reverse();
  document.getElementById("historyBox").innerHTML=arr.length?
  `<div class="card">${arr.map(x=>`<div class="history"><b>${esc(x.date)}</b> • ${esc(x.day)}<div style="margin-top:8px">${x.exercises.map(e=>`<div style="margin:7px 0"><b>${esc(e.exercise)}</b><br><span class="small">${(e.sets||[]).map(s=>`${esc(s.kg||"—")} kg × ${esc(s.reps||"—")}`).join(" • ")}${e.rir?` • RIR ${esc(e.rir)}`:""}</span></div>`).join("")}</div></div>`).join("")}</div>`
  :'<div class="card empty">No history yet.</div>';
}

function renderProgram(){
  let out="";
  Object.keys(data.program).forEach(day=>{
    out+=`<div style="margin-bottom:20px"><div class="section-title">${esc(day)}</div>`;
    data.program[day].forEach((x,i)=>{
      out+=`<div class="program-row"><input id="n-${day}-${i}" value="${esc(x[0])}" placeholder="Exercise name"><input id="s-${day}-${i}" value="${esc(x[1])}" inputmode="numeric" placeholder="Sets"><input id="r-${day}-${i}" value="${esc(x[2])}" placeholder="Rep range"><button class="danger" onclick="removeExercise('${escAttr(day)}',${i})">×</button></div>`;
    });
    out+=`<button class="secondary" onclick="addExercise('${escAttr(day)}')">＋ Add Exercise</button></div>`;
  });
  out+=`<div style="position:sticky;bottom:10px;padding:10px 0;background:var(--bg,white);z-index:5"><button class="btn" onclick="saveProgramChanges()" style="width:100%;">✓ OK — Save Program</button></div>`;
  document.getElementById("programBox").innerHTML=out;
}

function syncProgram(){
  Object.keys(data.program).forEach(day=>data.program[day].forEach((x,i)=>{
    let n=document.getElementById(`n-${day}-${i}`),s=document.getElementById(`s-${day}-${i}`),r=document.getElementById(`r-${day}-${i}`);
    if(n)x[0]=n.value.trim()||"New Exercise";
    if(s)x[1]=Math.max(1,parseInt(s.value)||1);
    if(r)x[2]=r.value.trim()||"8–12";
  }));
}
function saveProgramChanges(){syncProgram();save();loadDays();alert("Program saved ✓");}
function addExercise(day){syncProgram();data.program[day].push(["New Exercise",3,"8–12"]);renderProgram();}
function removeExercise(day,i){
  syncProgram();
  if(data.program[day].length<=1){alert("Keep at least one exercise.");return}
  if(confirm("Remove this exercise from the program? Existing history stays safe.")){data.program[day].splice(i,1);save();renderProgram();}
}

loadDays();
</script>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
<button class="btn" onclick="downloadSpreadsheet()">📊 Download Spreadsheet</button>
<button class="btn" onclick="downloadImage()">🖼️ Download Image</button>
</div>

<script>
function downloadSpreadsheet(){
  const state = JSON.parse(localStorage.getItem('gymTrackerV2') || '{"logs":[]}');
  const logs = Array.isArray(state.logs) ? state.logs : [];
  const rows = [['Date','Day','Exercise','Set','Weight (kg)','Reps','RIR','Notes']];
  logs.forEach(log => {
    const sets = Array.isArray(log.sets) ? log.sets : [];
    sets.forEach((s,i) => {
      rows.push([
        log.date || '',
        log.day || '',
        log.exercise || '',
        i + 1,
        s.weight ?? '',
        s.reps ?? '',
        s.rir ?? '',
        s.notes ?? ''
      ]);
    });
  });
  const esc = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const csv = '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gym-tracker-history.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>

<script>
function downloadImage(){
  const state = JSON.parse(localStorage.getItem('gymTrackerV2') || '{"logs":[]}');
  const logs = Array.isArray(state.logs) ? state.logs : [];
  const W = 1400;
  const pad = 55;
  const lineH = 42;
  const titleH = 105;
  const rows = [['Date','Day','Exercise','Set','Weight','Reps','RIR','Notes']];

  logs.forEach(log => {
    const sets = Array.isArray(log.sets) ? log.sets : [];
    sets.forEach((s,i) => rows.push([
      log.date || '', log.day || '', log.exercise || '', String(i+1),
      s.weight ?? '', s.reps ?? '', s.rir ?? '', s.notes ?? ''
    ]));
  });

  const cols = [
    {name:'Date', w:145},
    {name:'Day', w:125},
    {name:'Exercise', w:320},
    {name:'Set', w:70},
    {name:'Weight', w:105},
    {name:'Reps', w:90},
    {name:'RIR', w:80},
    {name:'Notes', w:365}
  ];

  const H = titleH + rows.length * lineH + pad;
  const canvas = document.createElement('canvas');
  canvas.width = W * 2;
  canvas.height = H * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2,2);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#111827';
  ctx.font = 'bold 34px Arial';
  ctx.fillText('Gym Tracker — Workout History', pad, 58);

  ctx.font = '16px Arial';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(new Date().toLocaleDateString(), pad, 85);

  let y = titleH;
  let x = pad;

  rows.forEach((row, ri) => {
    let xx = pad;
    if (ri === 0) {
      ctx.fillStyle = '#f3f4f6';
      ctx.fillRect(pad, y, W - pad*2, lineH);
    }
    row.forEach((cell, ci) => {
      ctx.strokeStyle = '#d1d5db';
      ctx.strokeRect(xx, y, cols[ci].w, lineH);
      ctx.fillStyle = ri === 0 ? '#111827' : '#374151';
      ctx.font = ri === 0 ? 'bold 15px Arial' : '14px Arial';
      let text = String(cell ?? '');
      const maxChars = Math.max(5, Math.floor(cols[ci].w / 8));
      if (text.length > maxChars) text = text.slice(0, maxChars - 1) + '…';
      ctx.fillText(text, xx + 8, y + 27);
      xx += cols[ci].w;
    });
    y += lineH;
  });

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gym-tracker-history.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, 'image/png');
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Gym Tracker</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--ink:#292824;--muted:#77736c;--line:#e7e2d9;--accent:#5b6178;--good:#2e7d5b;--bad:#b65c5c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:18px;overflow:auto}.tab{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #00000008}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}select,input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sets{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:7px;align-items:center}.sets>div{font-size:12px;color:var(--muted);text-align:center}.setno{font-weight:700;color:var(--ink)!important}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white;width:100%}.secondary{background:#eeeae2;color:var(--ink)}.danger{background:#f8e8e8;color:var(--bad)}
.exercise-title{font-size:18px;font-weight:750;margin-bottom:3px}.meta{font-size:12px;color:var(--muted);margin-bottom:14px}.last{background:#f5f3ef;border-radius:11px;padding:10px;margin-bottom:14px;font-size:13px}.last b{color:var(--ink)}
.status{font-weight:750}.good{color:var(--good)}.bad{color:var(--bad)}.neutral{color:var(--muted)}
.small{font-size:12px;color:var(--muted)}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.row button{flex:1}
.history-item{padding:11px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border-bottom:0}
.pr{font-size:22px;font-weight:800}.empty{padding:30px 10px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>My Gym Tracker</h1><div class="sub">Simple tracking • progressive overload</div></div>
    <button class="secondary" onclick="showSettings()">⚙️</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-log" onclick="showPage('log')">Workout</button>
    <button class="tab" id="tab-progress" onclick="showPage('progress')">Progress</button>
    <button class="tab" id="tab-history" onclick="showPage('history')">History</button>
  </div>

  <section id="page-log">
    <div class="card">
      <div class="grid">
        <div><label>DATE</label><input type="date" id="date"></div>
        <div><label>DAY</label><select id="day" onchange="renderExerciseSelect()"><option>UPPER</option><option>LOWER</option><option>FULL BODY</option></select></div>
      </div>
    </div>
    <div class="card">
      <label>EXERCISE</label>
      <select id="exercise" onchange="renderExercise()"></select>
    </div>
    <div id="exerciseCard"></div>
  </section>

  <section id="page-progress" class="hidden">
    <div id="progressList"></div>
  </section>

  <section id="page-history" class="hidden">
    <div class="card"><button class="danger" onclick="clearHistory()">Delete all saved data</button></div>
    <div id="historyList"></div>
  </section>

  <section id="page-settings" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">Program Setup</h2>
      <p class="small">Edit the exercises below once. After that, the Workout page becomes a tap-and-fill tracker.</p>
      <div id="programEditor"></div>
      <button class="primary" onclick="saveProgram()">Save Program</button>
    </div>
  </section>
</div>

<script>

const PROGRAM_VERSION="session1-v2";
const defaultProgram={
"UPPER":[["Seated Shoulder Press",4,"10"],["Standing Incline Lateral Raise",4,"10"],["Incline Cable Bench Press",4,"10"],["Biceps Cable Curl",4,"10"]],
"LOWER":[["Split Squat (Mobility)",1,"10 / leg"]],
"FULL BODY":[["Seated Shoulder Press",4,"10"],["Standing Incline Lateral Raise",4,"10"],["Incline Cable Bench Press",4,"10"],["Biceps Cable Curl",4,"10"],["Split Squat (Mobility)",1,"10 / leg"],["Full Plank",2,"1:00"]]
};
const session1Logs=[{"id": 1757376000000, "date": "2026-09-09", "day": "FULL BODY", "exercise": "Split Squat (Mobility)", "sets": [{"kg": "", "reps": "10 / leg"}], "rir": "", "notes": "Mobility warm-up; dynamic stretching + mobility work"}, {"id": 1757376000001, "date": "2026-09-09", "day": "FULL BODY", "exercise": "Seated Shoulder Press", "sets": [{"kg": "6", "reps": "10"}, {"kg": "6", "reps": "10"}, {"kg": "6", "reps": "10"}, {"kg": "6", "reps": "10"}], "rir": "", "notes": "Session 1"}, {"id": 1757376000002, "date": "2026-09-09", "day": "FULL BODY", "exercise": "Standing Incline Lateral Raise", "sets": [{"kg": "4", "reps": "10"}, {"kg": "4", "reps": "10"}, {"kg": "4", "reps": "10"}, {"kg": "4", "reps": "10"}], "rir": "", "notes": "Session 1"}, {"id": 1757376000003, "date": "2026-09-09", "day": "FULL BODY", "exercise": "Incline Cable Bench Press", "sets": [{"kg": "", "reps": ""}, {"kg": "", "reps": ""}, {"kg": "", "reps": ""}, {"kg": "", "reps": ""}], "rir": "", "notes": "Weight and reps not recorded in original recap"}, {"id": 1757376000004, "date": "2026-09-09", "day": "FULL BODY", "exercise": "Biceps Cable Curl", "sets": [{"kg": "12.5", "reps": "10"}, {"kg": "12.5", "reps": "10"}, {"kg": "12.5", "reps": "10"}, {"kg": "12.5", "reps": "10"}], "rir": "", "notes": "Session 1"}, {"id": 1757376000005, "date": "2026-09-09", "day": "FULL BODY", "exercise": "Full Plank", "sets": [{"kg": "", "reps": "1:00"}, {"kg": "", "reps": "1:00"}], "rir": "", "notes": "Core"}];
let program;
let logs;
if(localStorage.getItem("gymProgramVersion")!==PROGRAM_VERSION){
  program=JSON.parse(JSON.stringify(defaultProgram));
  logs=JSON.parse(session1Logs);
  localStorage.setItem("gymProgram",JSON.stringify(program));
  localStorage.setItem("gymLogs",JSON.stringify(logs));
  localStorage.setItem("gymProgramVersion",PROGRAM_VERSION);
}else{
  program=JSON.parse(localStorage.getItem("gymProgram")||JSON.stringify(defaultProgram));
  logs=JSON.parse(localStorage.getItem("gymLogs")||"[]");
}

document.getElementById("date").value=new Date().toISOString().slice(0,10);

function save(){localStorage.setItem("gymProgram",JSON.stringify(program));localStorage.setItem("gymLogs",JSON.stringify(logs))}
function showPage(p){
  ["log","progress","history","settings"].forEach(x=>document.getElementById("page-"+x).classList.toggle("hidden",x!==p));
  ["log","progress","history"].forEach(x=>document.getElementById("tab-"+x)?.classList.toggle("active",x===p));
  if(p==="progress")renderProgress(); if(p==="history")renderHistory();
}
function renderExerciseSelect(){
  const day=document.getElementById("day").value, sel=document.getElementById("exercise");
  sel.innerHTML=program[day].map((e,i)=>`<option value="${i}">${e[0]}</option>`).join("");
  renderExercise();
}
function previous(day, name){
  return [...logs].reverse().find(x=>x.day===day&&x.exercise===name);
}
function renderExercise(){
  const day=document.getElementById("day").value, idx=+document.getElementById("exercise").value, e=program[day][idx], last=previous(day,e[0]);
  const sets=e[1];
  let lastText=last ? `Last: <b>${last.sets.filter(s=>s.kg!==""||s.reps!=="").map(s=>`${s.kg||"—"} kg × ${s.reps||"—"}`).join("  •  ")}</b>` : "First time logging this exercise.";
  let rows="";
  for(let i=0;i<sets;i++){
    let s=last?.sets?.[i]||{};
    rows+=`<div class="sets"><div class="setno">S${i+1}</div><input inputmode="decimal" id="kg${i}" placeholder="${s.kg??"kg"}"><input inputmode="numeric" id="reps${i}" placeholder="${s.reps??"reps"}"><div class="small">kg × reps</div></div>`;
  }
  document.getElementById("exerciseCard").innerHTML=`
  <div class="card">
    <div class="exercise-title">${e[0]}</div><div class="meta">${e[1]} sets • target ${e[2]}</div>
    <div class="last">${lastText}</div>
    ${rows}
    <div style="margin-top:13px"><label>RIR <span class="small">(optional but useful)</span></label><input id="rir" inputmode="numeric" placeholder="e.g. 2"></div>
    <div style="margin-top:13px"><label>NOTES <span class="small">(optional)</span></label><input id="notes" placeholder="e.g. felt strong"></div>
    <button class="primary" style="margin-top:14px" onclick="saveExercise()">✓ Save Exercise</button>
  </div>`;
}
function saveExercise(){
  const day=document.getElementById("day").value, idx=+document.getElementById("exercise").value, e=program[day][idx];
  let sets=[]; for(let i=0;i<e[1];i++) sets.push({kg:document.getElementById("kg"+i).value,reps:document.getElementById("reps"+i).value});
  if(!sets.some(s=>s.kg!==""||s.reps!=="")) return alert("Isi minimal 1 set dulu ya.");
  logs.push({id:Date.now(),date:document.getElementById("date").value,day,exercise:e[0],sets,rir:document.getElementById("rir").value,notes:document.getElementById("notes").value});
  save(); alert("Saved ✓"); renderExercise();
}
function volume(log){return log.sets.reduce((a,s)=>a+(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0),0)}
function best(log){return Math.max(...log.sets.map(s=>parseFloat(s.kg)||0))}
function totalReps(log){return log.sets.reduce((a,s)=>a+(parseInt(s.reps)||0),0)}
function renderProgress(){
  let names=Object.values(program).flat().map(x=>x[0]);
  let html="";
  names.forEach(name=>{
    let arr=logs.filter(x=>x.exercise===name); let last=arr.at(-1), prev=arr.at(-2);
    let change=last&&prev?best(last)-best(prev):null;
    html+=`<div class="card"><div class="exercise-title">${name}</div>`;
    if(!last) html+=`<div class="empty">Not logged yet</div>`;
    else html+=`<div class="grid"><div><div class="small">LAST BEST</div><div class="pr">${best(last)} kg</div></div><div><div class="small">TOTAL REPS</div><div class="pr">${totalReps(last)}</div></div></div>
      <div style="margin-top:12px" class="status ${change>0?'good':change<0?'bad':'neutral'}">${prev?(change>0?'↑ Progress':change<0?'↓ Check':'→ Same'):'Baseline'}</div>`;
    html+=`</div>`;
  });
  document.getElementById("progressList").innerHTML=html;
}
function renderHistory(){
  let arr=[...logs].reverse();
  document.getElementById("historyList").innerHTML=arr.length?`<div class="card">${arr.map(l=>`<div class="history-item"><b>${l.date}</b> • ${l.day}<br><b>${l.exercise}</b><br><span class="small">${l.sets.map(s=>`${s.kg||"—"} kg × ${s.reps||"—"}`).join(" • ")}${l.rir!==""?" • RIR "+l.rir:""}</span></div>`).join("")}</div>`:`<div class="card empty">No workouts saved yet.</div>`;
}
function clearHistory(){if(confirm("Delete all workout history?")){logs=[];save();renderHistory();}}
function showSettings(){
  document.getElementById("page-log").classList.add("hidden");document.getElementById("page-progress").classList.add("hidden");document.getElementById("page-history").classList.add("hidden");document.getElementById("page-settings").classList.remove("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));renderEditor();
}
function renderEditor(){
 let html="";
 Object.keys(program).forEach(day=>{
  html+=`<h3>${day}</h3>`;
  program[day].forEach((e,i)=>html+=`<div class="grid" style="margin-bottom:8px"><input id="p-${day}-${i}" value="${e[0]}"><input id="r-${day}-${i}" value="${e[2]}"></div>`);
 });
 document.getElementById("programEditor").innerHTML=html;
}
function saveProgram(){
 Object.keys(program).forEach(day=>program[day].forEach((e,i)=>{e[0]=document.getElementById(`p-${day}-${i}`).value;e[2]=document.getElementById(`r-${day}-${i}`).value;}));
 save();alert("Program saved ✓");showPage("log");renderExerciseSelect();
}
renderExerciseSelect();
</script>
</body>
</html>
